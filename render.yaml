services:
  - type: web
    name: paynest-api
    env: docker
    plan: standard
    region: oregon
    # Build is driven by docker/Dockerfile (Bun toolchain).
    # Render builds the Dockerfile and runs CMD ["node","dist/main"].
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: PORT
        value: "3000"

      # CRITICAL: App URL for production (set to your Render URL)
      - key: APP_URL
        sync: false
      - key: APP_ORIGIN
        sync: false

      # CORS: Set to your Vercel frontend URL
      - key: CORS_ORIGIN
        sync: false

      # Database (Supabase)
      - key: DB_SYNCHRONIZE
        value: "false"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DATABASE
        sync: false

      # Redis (Upstash). The app and preflight also support REDIS_URL; this blueprint uses split vars.
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_TLS
        value: "true"

      # Auth
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: "24h"
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPERATOR_PASSWORD
        sync: false
      - key: VIEWER_PASSWORD
        sync: false

      # Gateway secrets (sandbox values)
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENVIRONMENT
        value: "sandbox"
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: BKASH_API_KEY
        sync: false
      - key: BKASH_SECRET
        sync: false
      - key: BKASH_USERNAME
        sync: false
      - key: BKASH_PASSWORD
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_HASH
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_HASH
        sync: false
      - key: SQUARE_ACCESS_TOKEN
        sync: false
      - key: SQUARE_WEBHOOK_SIGNATURE_KEY
        sync: false
      - key: ADYEN_API_KEY
        sync: false
      - key: ADYEN_WEBHOOK_SECRET
        sync: false
